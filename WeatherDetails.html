<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #f87171;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            max-width: 500px;
            margin-bottom: 1.5rem;
        }
        .search-box input {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid #334155;
            background: var(--card);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box button {
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: #0f172a;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        .search-box button:hover { opacity: 0.9; }
        .container {
            width: 100%;
            max-width: 800px;
            display: grid;
            gap: 1.25rem;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .card-header h2 { font-size: 1.1rem; color: var(--muted); font-weight: 500; }
        .source { font-size: 0.75rem; color: var(--muted); }
        .current-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .temp-large { font-size: 3.5rem; font-weight: 700; line-height: 1; }
        .condition { font-size: 1.1rem; color: var(--muted); margin-top: 0.25rem; }
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .detail-item {
            background: #0f172a;
            border-radius: 10px;
            padding: 0.75rem;
            text-align: center;
        }
        .detail-item .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-item .value { font-size: 1.1rem; font-weight: 600; margin-top: 0.25rem; }
        .hourly-scroll {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        .hour-card {
            flex: 0 0 70px;
            text-align: center;
            background: #0f172a;
            border-radius: 10px;
            padding: 0.75rem 0.25rem;
        }
        .hour-card .time { font-size: 0.75rem; color: var(--muted); }
        .hour-card .icon { font-size: 1.4rem; margin: 0.3rem 0; }
        .hour-card .temp { font-size: 1rem; font-weight: 600; }
        .hour-card .humidity { font-size: 0.7rem; color: var(--muted); }
        .alert-banner {
            background: #7f1d1d;
            border: 1px solid var(--danger);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .alert-banner strong { color: #fecaca; }
        .error { color: var(--danger); text-align: center; padding: 2rem; }
        .loading { text-align: center; color: var(--muted); padding: 2rem; }
        .footer { margin-top: 2rem; font-size: 0.75rem; color: var(--muted); text-align: center; }
        @media (max-width: 480px) { .temp-large { font-size: 2.8rem; } }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name (e.g., London)" />
        <button id="searchBtn">Search</button>
    </div>

    <div class="container">
        <div id="alertContainer"></div>
        <div id="loadingMsg" class="loading" style="display:none;">Loading weather data…</div>
        <div id="errorMsg" class="error" style="display:none;"></div>
        <div id="dashboard" style="display:none;">

            <!-- Current Conditions -->
            <div class="card">
                <div class="card-header">
                    <h2 id="locationName">—</h2>
                    <span class="source" id="lastUpdated"></span>
                </div>
                <div class="current-main">
                    <div>
                        <div class="temp-large" id="currentTemp">—</div>
                        <div class="condition" id="currentCondition">—</div>
                    </div>
                    <div style="font-size: 4rem;" id="currentIcon">—</div>
                </div>
                <div class="details-grid">
                    <div class="detail-item"><div class="label">Humidity</div><div class="value" id="humidity">—</div></div>
                    <div class="detail-item"><div class="label">Wind</div><div class="value" id="wind">—</div></div>
                    <div class="detail-item"><div class="label">Gusts</div><div class="value" id="gusts">—</div></div>
                    <div class="detail-item"><div class="label">Pressure</div><div class="value" id="pressure">—</div></div>
                </div>
            </div>

            <!-- Hourly Forecast -->
            <div class="card">
                <div class="card-header"><h2>Next 12 Hours</h2></div>
                <div class="hourly-scroll" id="hourlyForecast"></div>
            </div>

            <!-- Historical Comparison -->
            <div class="card">
                <div class="card-header"><h2>Yesterday vs Today</h2></div>
                <p id="historicalText" style="color: var(--muted); line-height: 1.6;">Loading historical data...</p>
            </div>

        </div>
    </div>

    <div class="footer">
        Data provided by <a href="https://open-meteo.com/" target="_blank" style="color: var(--accent);">Open-Meteo</a> (free, no API key required).<br>
        Always consult official government sources for severe weather warnings.
    </div>

    <script>
        const cityInput    = document.getElementById('cityInput');
        const searchBtn    = document.getElementById('searchBtn');
        const errorMsg     = document.getElementById('errorMsg');
        const loadingMsg   = document.getElementById('loadingMsg');
        const dashboard    = document.getElementById('dashboard');
        const alertContainer = document.getElementById('alertContainer');

        // WMO Weather interpretation codes
        const weatherCodes = {
            0: { text: 'Clear sky',           icon: '☀️' },
            1: { text: 'Mainly clear',        icon: '🌤️' },
            2: { text: 'Partly cloudy',       icon: '⛅' },
            3: { text: 'Overcast',            icon: '☁️' },
            45: { text: 'Fog',                icon: '🌫️' },
            48: { text: 'Rime fog',           icon: '🌫️' },
            51: { text: 'Light drizzle',      icon: '🌦️' },
            53: { text: 'Moderate drizzle',   icon: '🌦️' },
            55: { text: 'Dense drizzle',      icon: '🌧️' },
            61: { text: 'Slight rain',        icon: '🌧️' },
            63: { text: 'Moderate rain',      icon: '🌧️' },
            65: { text: 'Heavy rain',         icon: '🌧️' },
            71: { text: 'Slight snow',        icon: '🌨️' },
            73: { text: 'Moderate snow',      icon: '🌨️' },
            75: { text: 'Heavy snow',         icon: '❄️' },
            80: { text: 'Rain showers',       icon: '🌦️' },
            81: { text: 'Moderate showers',   icon: '🌧️' },
            82: { text: 'Violent showers',    icon: '⛈️' },
            95: { text: 'Thunderstorm',       icon: '⛈️' },
            96: { text: 'Thunderstorm + hail',icon: '⛈️' },
            99: { text: 'Thunderstorm + heavy hail', icon: '⛈️' }
        };
        const getWeatherInfo = (code) => weatherCodes[code] || { text: 'Unknown', icon: '❓' };

        // 1. Geocode city name -> lat/lon
        async function geocode(city) {
            const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Geocoding service unavailable.');
            const data = await res.json();
            if (!data.results || data.results.length === 0) {
                throw new Error(`City "${city}" not found. Please try another name.`);
            }
            return {
                lat: data.results[0].latitude,
                lon: data.results[0].longitude,
                name: data.results[0].name,
                country: data.results[0].country || ''
            };
        }

        // 2. Fetch forecast (current + hourly + daily, with 1 past day for comparison)
        async function fetchWeather(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
                `&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure,weather_code` +
                `&hourly=temperature_2m,relative_humidity_2m,weather_code` +
                `&daily=temperature_2m_max,temperature_2m_min,wind_speed_10m_max` +
                `&timezone=auto&forecast_days=2&past_days=1`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Weather service unavailable.');
            return await res.json();
        }

        // 3. Render the UI
        async function render(city) {
            try {
                // Reset state
                errorMsg.style.display = 'none';
                dashboard.style.display = 'none';
                loadingMsg.style.display = 'block';
                alertContainer.innerHTML = '';

                const loc = await geocode(city);
                const weather = await fetchWeather(loc.lat, loc.lon);

                // ---------- Current Conditions ----------
                document.getElementById('locationName').textContent = `${loc.name}, ${loc.country}`;
                document.getElementById('currentTemp').textContent = `${Math.round(weather.current.temperature_2m)}°C`;
                document.getElementById('currentCondition').textContent = getWeatherInfo(weather.current.weather_code).text;
                document.getElementById('currentIcon').textContent = getWeatherInfo(weather.current.weather_code).icon;
                document.getElementById('humidity').textContent = `${weather.current.relative_humidity_2m}%`;
                document.getElementById('wind').textContent = `${weather.current.wind_speed_10m} km/h`;
                document.getElementById('gusts').textContent = `${weather.current.wind_gusts_10m} km/h`;
                document.getElementById('pressure').textContent = `${Math.round(weather.current.surface_pressure)} hPa`;
                document.getElementById('lastUpdated').textContent = `Updated: ${new Date().toLocaleTimeString()}`;

                // Simple severe-weather notice (high wind gusts)
                if (weather.current.wind_gusts_10m > 70) {
                    alertContainer.innerHTML = `<div class="alert-banner"><strong>⚠️ High Wind Advisory:</strong> Gusts exceeding 70 km/h are occurring here. Secure loose objects and exercise caution.</div>`;
                }

                // ---------- Hourly Forecast (next 12 hours) ----------
                const hourlyContainer = document.getElementById('hourlyForecast');
                hourlyContainer.innerHTML = '';

                // Compare by the first 13 chars of the ISO timestamp: "2024-01-15T14"
                const currentHourKey = (weather.current.time || '').substring(0, 13);
                let startIndex = weather.hourly.time.findIndex(t => t.substring(0, 13) >= currentHourKey);
                if (startIndex === -1) startIndex = 0;

                const endIndex = Math.min(startIndex + 12, weather.hourly.time.length);
                for (let i = startIndex; i < endIndex; i++) {
                    const hourDate = new Date(weather.hourly.time[i]);
                    const hourLabel = hourDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const temp = Math.round(weather.hourly.temperature_2m[i]);
                    const hum  = weather.hourly.relative_humidity_2m[i];
                    const info = getWeatherInfo(weather.hourly.weather_code[i]);

                    hourlyContainer.innerHTML += `
                        <div class="hour-card">
                            <div class="time">${hourLabel}</div>
                            <div class="icon">${info.icon}</div>
                            <div class="temp">${temp}°C</div>
                            <div class="humidity">${hum}% RH</div>
                        </div>
                    `;
                }

                // ---------- Yesterday vs Today (historical comparison) ----------
                const histText = document.getElementById('historicalText');
                const daily = weather.daily;

                if (
                    daily &&
                    Array.isArray(daily.temperature_2m_max) &&
                    daily.temperature_2m_max.length >= 2 &&
                    daily.temperature_2m_max[0] != null &&
                    daily.temperature_2m_max[1] != null
                ) {
                    const yMax = Math.round(daily.temperature_2m_max[0]);
                    const yMin = Math.round(daily.temperature_2m_min[0]);
                    const yWind = Math.round(daily.wind_speed_10m_max[0]);
                    const todayMax = Math.round(daily.temperature_2m_max[1]);
                    const diff = todayMax - yMax;
                    const diffText = diff > 0 ? `${diff}°C warmer` : diff < 0 ? `${Math.abs(diff)}°C cooler` : 'the same';

                    histText.innerHTML = `
                        Yesterday (${daily.time[0]}): High <strong>${yMax}°C</strong> / Low <strong>${yMin}°C</strong>, max wind <strong>${yWind} km/h</strong>.<br>
                        Today's forecast high is <strong>${todayMax}°C</strong> — that is
                        <strong style="color: var(--accent);">${diffText}</strong> than yesterday's high.
                    `;
                } else {
                    histText.textContent = 'Historical comparison data is not available for this location.';
                }

                loadingMsg.style.display = 'none';
                dashboard.style.display = 'block';

            } catch (err) {
                console.error(err);
                loadingMsg.style.display = 'none';
                errorMsg.style.display = 'block';
                errorMsg.textContent = err.message || 'Something went wrong. Please try again.';
            }
        }

        // ---------- Event listeners ----------
        const doSearch = () => {
            const city = cityInput.value.trim();
            if (city) render(city);
        };
        searchBtn.addEventListener('click', doSearch);
        cityInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSearch(); });

        // Default city on load
        window.addEventListener('load', () => {
            cityInput.value = 'London';
            render('London');
        });
    </script>
</body>
</html>
